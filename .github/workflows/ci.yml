name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-smoke:
    name: Validate and boot x86-64 image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils cpio file gzip qemu-system-x86

      - name: Check shell syntax
        run: |
          bash -n scripts/*.sh
          sh -n linux_distro_original/distro/fs/etc/init.d/rcS

      - name: Validate kernel and root filesystem
        run: ./scripts/validate-distro.sh

      - name: Build compressed initramfs
        run: ./scripts/build-initramfs.sh

      - name: Verify initramfs archive
        run: |
          gzip -t build/initramfs.cpio.gz
          sha256sum -c build/SHA256SUMS

      - name: Boot under QEMU
        run: ./scripts/qemu-smoke-test.sh

      - name: Publish boot assets for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: szh-x86_64-boot-assets
          path: |
            linux_distro_original/src/linux/arch/x86/boot/bzImage
            build/initramfs.cpio.gz
            build/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
