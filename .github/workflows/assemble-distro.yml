
name: Move Linux Distro to Repository Root

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Move distro directory to root
        shell: bash
        run: |
          set -euo pipefail

          SOURCE="linux-distro/linux_distro_original"
          DESTINATION="linux_distro_original"

          if [ ! -d "$SOURCE" ]; then
            echo "Source directory not found!"
            exit 1
          fi

          if [ -e "$DESTINATION" ]; then
            echo "Destination already exists. Stopping safely."
            exit 1
          fi

          mv "$SOURCE" "$DESTINATION"
          rmdir linux-distro

          echo "Directory relocated successfully."
          ls -la

      - name: Commit relocation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f -A -- linux-distro linux_distro_original

          git diff --cached --stat

          git commit -m "Move Linux distro to repository root"

          git push origin HEAD:main
