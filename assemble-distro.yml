
name: Assemble Linux Distro

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assemble parts
        run: |
          set -euo pipefail

          cat linux-distro-part-aa linux-distro-part-ab > linux-distro

          ls -lh linux-distro
          sha256sum linux-distro

      - name: Commit assembled file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add linux-distro

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Assemble Linux distro"
          git push
