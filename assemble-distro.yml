
name: Extract Linux Distro into Main

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Reassemble distro
        run: |
          set -euo pipefail
          cat linux-distro-part-aa linux-distro-part-ab > /tmp/linux-distro
          ls -lh /tmp/linux-distro
          sha256sum /tmp/linux-distro

      - name: Verify archive
        run: |
          set -euo pipefail
          tar -tf /tmp/linux-distro > /tmp/archive-list.txt
          echo "Archive verified."
          head -20 /tmp/archive-list.txt

      - name: Extract distro
        run: |
          set -euo pipefail

          mkdir -p linux-distro

          tar --no-same-owner \
            -xf /tmp/linux-distro \
            -C linux-distro

          echo "Extraction complete."
          du -sh linux-distro
          find linux-distro -type f | wc -l

      - name: Check GitHub file limits
        run: |
          set -euo pipefail

          oversized=$(find linux-distro -type f -size +100M -print)

          if [ -n "$oversized" ]; then
            echo "Files exceeding GitHub's 100 MB limit:"
            echo "$oversized"
            exit 1
          fi

          total=$(du -sb linux-distro | cut -f1)

          echo "Extracted size: $total bytes"

          if [ "$total" -gt 8589934592 ]; then
            echo "Extraction exceeds 8 GiB. Stopping for storage review."
            exit 1
          fi

      - name: Commit extracted files to main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add linux-distro/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Linux distro into main"

          git push origin HEAD:main
